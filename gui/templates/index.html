<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能文本分析工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <section class="section input-section">
        <div class="container slide-up">
            <div class="input-container">
                <h1>智能文本分析</h1>
                <form method="post" id="textAnalysisForm">
                    <div class="form-group">
                        <textarea id="input_text" name="input_text" placeholder="请在此输入文本内容...">{{ input_text }}</textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <span>开始分析</span>
                    </button>
                </form>

                <div class="result-container">
                    <h2>摘要信息</h2>
                    <div class="result-box1" id="summaryResult">{{ summary  }}</div>
                    <h2>分析结果</h2>
                    <div class="result-box2" id="detailResult">{{ result }}</div>
                </div>
            </div>
        </div>
    </section>

    <section class="section capabilities-section">
        <div class="container fade-in">
            <div class="capabilities-container">
                <div class="capabilities-title">核心功能与技术</div>
                <div class="capabilities-content">
                    <h3>文本摘要</h3>
                    <ul>
                        <li><strong>核心功能</strong>：自动提炼文本核心内容，生成简洁准确的摘要</li>
                        <li><strong>应用范围</strong>：各类文章、新闻、小说</li>
                    </ul>

                    <h3>ai文本识别</h3>
                    <ul>
                        <li><strong>核心功能</strong>：识别文本是否由人工智能生成</li>
                        <li><strong>应用范围</strong>：各类文章、新闻、小说</li>
                        <li><strong>技术实现</strong>：基于Qwen2.5模型微调实现</li>
                    </ul>

                </div>
            </div>
        </div>
    </section>

     <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
